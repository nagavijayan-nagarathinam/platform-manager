{{- if .Values.ingress.enabled -}}
{{- $fullName := include "generic-service.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    app.kubernetes.io/name: {{ include "generic-service.name" . }}
    app.kubernetes.io/instance: {{ $fullName }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    {{- with .Values.ingress.annotations }}
{{ toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
  {{- range .Values.ingress.hosts }}
  - host: {{ .host | quote }}
    http:
      paths:
      {{- range .paths }}
      - path: {{ .path }}
        pathType: {{ .pathType }}
        backend:
          service:
            name: {{ $.Release.Name }}
            port:
              number: {{ $.Values.service.port }}
      {{- end }}
  {{- end }}
{{- end }}
{{- if .Values.istio.enabled }}
---
{{- if .Values.istio.gateway.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: {{ .Release.Name }}-gateway
spec:
  selector:
{{ toYaml .Values.istio.gateway.selector | nindent 4 }}
  servers:
  {{- range .Values.ingress.hosts }}
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
      - {{ .host | quote }}
  {{- end }}
---
{{- end }}
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ .Release.Name }}-vs
spec:
  hosts:
  {{- range .Values.ingress.hosts }}
    - {{ .host | quote }}
  {{- end }}
  gateways:
    - {{ .Release.Name }}-gateway
  http:
    - match:
      {{- range .Values.ingress.hosts }}
        {{- range .paths }}
        - uri:
            prefix: {{ .path | quote }}
        {{- end }}
      {{- end }}
      route:
        - destination:
            host: {{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: {{ .Values.service.port }}
{{- end }}
