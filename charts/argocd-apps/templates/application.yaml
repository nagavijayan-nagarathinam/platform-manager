{{- range .Values.microservices }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ default "prod" $.Values.global.environment }}-microservice-{{ .name }}
  namespace: {{  default "argocd" $.Values.global.application.namespace }}
spec:
  project: {{ $.Values.environment }}-microservices
  destination:
    server: {{ $.Values.global.destinationServer }}
    namespace: {{ .namespace }}
  source:
    repoURL: {{ $.Values.global.gitRepo.url }}
    targetRevision: {{ $.Values.global.gitRepo.branch }}
    chart: charts/microservice
    helm:
      releaseName: {{ .name }}
      valueFiles:
        - values/{{ default "production" $.Values.global.environment }}/microservices/{{ .group }}/{{ .name }}.yaml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}
