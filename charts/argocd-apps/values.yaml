global:
  application:
    namespace: argocd
  # environment, valuesPath: set in values file (e.g. values/production/microservices/values.yaml)
  projectName: production-microservices
  gitRepo:
    url: https://github.com/nagavijayan-nagarathinam/platform-manager
    branch: main
  destinationServer: https://kubernetes.default.svc

# AppProjects (optional – can be managed separately)
projects: []
  # - name: production-microservices
  #   sourceRepos:
  #     - "*"

# Microservice list: override via -f values/production/microservices/values.yaml
# Supported per entry keys:
# - group, name, namespace (required)
# - releaseName (optional)
# - valueFile (optional; defaults to values/<env>/microservices/<group>/<name>.yaml)
# - source.repoURL, source.targetRevision, source.path OR source.chart (optional)
microservices: []
