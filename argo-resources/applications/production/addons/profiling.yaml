apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: production-addon-profiling
  namespace: argocd
spec:
  project: production-addons
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: pyroscope
      targetRevision: "1.18.1"
      helm:
        releaseName: platform-pyroscope
        values: |
          pyroscope:
            replicaCount: 1
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 1Gi
            persistence:
              enabled: true
              size: 5Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
