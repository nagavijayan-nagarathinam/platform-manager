apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: production-microservice-manager
  namespace: argocd
spec:
  project: production-microservices
  source:
    repoURL: https://github.com/nagavijayan-nagarathinam/platform-manager
    path: charts/argo-apps  # Local Chart.yaml dir
    targetRevision: HEAD   # Latest commit (no tag needed)
    helm:
      releaseName: microservice
      valueFiles:
      - values/production/microservices/values.yaml  # Relative to path
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
