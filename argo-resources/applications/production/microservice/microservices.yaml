apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: production-microservice-manager
  namespace: argocd
spec:
  project: production-microservices
  source:
    repoURL: https://github.com/nagavijayan-nagarathinam/platform-manager
    path: charts/argocd-apps
    targetRevision: 1.0.0
    helm:
      releaseName: production-microservice-manager
      valueFiles:
      - values/production/microservices/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: {prune: true, selfHeal: true}