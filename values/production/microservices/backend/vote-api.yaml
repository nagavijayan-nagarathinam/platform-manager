# vote-api – overrides for charts/microservice
replicaCount: 1
image:
  repository: dockersamples/examplevotingapp_vote
  tag: "latest"
service:
  type: ClusterIP
  port: 80
ingress:
  enabled: false
  className: nginx
  hosts:
    - host: vote-api.platform.example.com
      paths:
        - path: /
          pathType: Prefix
istio:
  enabled: true
hpa:
  enabled: false
