# vote-frontend – overrides for charts/microservice
replicaCount: 1
image:
  repository: dockersamples/examplevotingapp_result
  tag: "latest"
service:
  type: ClusterIP
  port: 80
ingress:
  enabled: false
  className: nginx
  hosts:
    - host: vote.platform.example.com
      paths:
        - path: /
          pathType: Prefix
istio:
  enabled: true
  gateways:
    - platform/platform-gateway
  gateway:
    enabled: false
hpa:
  enabled: false
configmap:
  data:
    VOTE_API: "http://vote-api.platform.svc.cluster.local"
    WORKER_API: "http://vote-worker.platform.svc.cluster.local"
