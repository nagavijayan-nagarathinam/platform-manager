fullnameOverride: redis
architecture: standalone

auth:
  enabled: false

master:
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

service:
  type: ClusterIP

extraDeploy:
  - apiVersion: v1
    kind: Service
    metadata:
      name: redis
      namespace: platform
    spec:
      type: ClusterIP
      ports:
        - name: redis
          port: 6379
          targetPort: 6379
          protocol: TCP
      selector:
        app.kubernetes.io/name: redis
        app.kubernetes.io/instance: redis
        app.kubernetes.io/component: master
