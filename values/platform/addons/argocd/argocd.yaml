# Argo CD values for Helm chart 3.3.2
# Structure matches chart 3.3.2 to avoid coalesce and YAML parse errors.
# Ref: https://github.com/argoproj/argo-helm/tree/argo-cd-3.3.2/charts/argo-cd

nameOverride: argocd
fullnameOverride: ""
installCRDs: true

global:
  image:
    repository: quay.io/argoproj/argocd
    tag: "v3.3.2"
    imagePullPolicy: IfNotPresent
  securityContext: {}
  imagePullSecrets: []
  hostAliases: []

controller:
  name: application-controller
  replicas: 1
  enableStatefulSet: false
  args:
    statusProcessors: "20"
    operationProcessors: "10"
    appResyncPeriod: "180"
    selfHealTimeout: "5"
  logFormat: text
  logLevel: info
  extraArgs: []
  env: []
  podAnnotations: {}
  podLabels: {}
  containerSecurityContext: {}
  containerPort: 8082
  readinessProbe:
    failureThreshold: 3
    initialDelaySeconds: 10
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 1
  livenessProbe:
    failureThreshold: 3
    initialDelaySeconds: 10
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 1
  volumeMounts: []
  volumes: []
  service:
    annotations: {}
    labels: {}
    port: 8082
    portName: https-controller
  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""
  resources: {}
  serviceAccount:
    create: true
    name: argocd-application-controller
    annotations: {}
    automountServiceAccountToken: true
  metrics:
    enabled: false
    service:
      annotations: {}
      labels: {}
      servicePort: 8082
    serviceMonitor:
      enabled: false
    rules:
      enabled: false
      spec: []
  clusterAdminAccess:
    enabled: true
  clusterRoleRules:
    enabled: false
    rules: []

dex:
  enabled: true
  name: dex-server
  metrics:
    enabled: false
    service:
      annotations: {}
      labels: {}
    serviceMonitor:
      enabled: false
  image:
    repository: quay.io/dexidp/dex
    tag: v2.26.0
    imagePullPolicy: IfNotPresent
  env: []
  podAnnotations: {}
  podLabels: {}
  serviceAccount:
    create: true
    name: argocd-dex-server
    annotations: {}
    automountServiceAccountToken: true
  volumeMounts:
    - name: static-files
      mountPath: /shared
  volumes:
    - name: static-files
      emptyDir: {}
  containerPortHttp: 5556
  servicePortHttp: 5556
  containerPortGrpc: 5557
  servicePortGrpc: 5557
  containerPortMetrics: 5558
  servicePortMetrics: 5558
  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""
  containerSecurityContext: {}
  resources: {}

redis:
  enabled: true
  name: redis
  image:
    repository: redis
    tag: 6.2.2-alpine
    imagePullPolicy: IfNotPresent
  extraArgs: []
  containerPort: 6379
  servicePort: 6379
  env: []
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""
  containerSecurityContext: {}
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    runAsNonRoot: true
  resources: {}
  volumeMounts: []
  volumes: []

redis-ha:
  enabled: false

server:
  name: server
  replicas: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 50
    targetMemoryUtilizationPercentage: 50
  image:
    repository: ""
    tag: ""
    imagePullPolicy: ""
  extraArgs: []
  env: []
  lifecycle: {}
  logFormat: text
  logLevel: info
  podAnnotations: {}
  podLabels: {}
  containerPort: 8080
  readinessProbe:
    failureThreshold: 3
    initialDelaySeconds: 10
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 1
  livenessProbe:
    failureThreshold: 3
    initialDelaySeconds: 10
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 1
  volumeMounts: []
  volumes: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""
  containerSecurityContext: {}
  resources: {}
  certificate:
    enabled: false
    domain: argocd.example.com
    issuer: {}
    additionalHosts: []
  service:
    annotations: {}
    labels: {}
    type: ClusterIP
    nodePortHttp: 30080
    nodePortHttps: 30443
    servicePortHttp: 80
    servicePortHttps: 443
    servicePortHttpName: http
    servicePortHttpsName: https
    namedTargetPort: true
    loadBalancerIP: ""
    loadBalancerSourceRanges: []
    externalIPs: []
  metrics:
    enabled: false
    service:
      annotations: {}
      labels: {}
      servicePort: 8083
    serviceMonitor:
      enabled: false
  serviceAccount:
    create: true
    name: argocd-server
    annotations: {}
    automountServiceAccountToken: true
  ingress:
    enabled: false
    annotations: {}
    labels: {}
    ingressClassName: ""
    hosts: []
    paths:
      - /
    extraPaths: []
    tls: []
    https: false
  ingressGrpc:
    enabled: false
    annotations: {}
    labels: {}
    ingressClassName: ""
    hosts: []
    paths:
      - /
    extraPaths: []
    tls: []
    https: false
  route:
    enabled: false
    hostname: ""
  configEnabled: true
  config:
    url: https://argocd.example.com
    application.instanceLabelKey: argocd.argoproj.io/instance
  configAnnotations: {}
  rbacConfig: {}
  rbacConfigAnnotations: {}
  rbacConfigCreate: true
  additionalApplications: []
  additionalProjects: []
  clusterAdminAccess:
    enabled: true
  GKEbackendConfig:
    enabled: false
    spec: {}
  extraContainers: []

repoServer:
  name: repo-server
  replicas: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 50
    targetMemoryUtilizationPercentage: 50
  image:
    repository: ""
    tag: ""
    imagePullPolicy: ""
  extraArgs: []
  env: []
  logFormat: text
  logLevel: info
  podAnnotations: {}
  podLabels: {}
  containerPort: 8081
  readinessProbe:
    failureThreshold: 3
    initialDelaySeconds: 10
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 1
  livenessProbe:
    failureThreshold: 3
    initialDelaySeconds: 10
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 1
  volumeMounts: []
  volumes: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""
  containerSecurityContext: {}
  resources: {}
  service:
    annotations: {}
    labels: {}
    port: 8081
    portName: https-repo-server
  metrics:
    enabled: false
    service:
      annotations: {}
      labels: {}
      servicePort: 8084
    serviceMonitor:
      enabled: false
  serviceAccount:
    create: false
    annotations: {}
    automountServiceAccountToken: true

# Chart 3.3.2 expects clusterCredentials as array ([]), not table ({})
configs:
  clusterCredentials: []
  knownHostsAnnotations: {}
  knownHosts:
    data:
      ssh_known_hosts: |
        bitbucket.org ssh-rsa 
        github.com ssh-rsa 
        gitlab.com ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBFSMqzJeV9rUzU4kWitGjeR4PWSa29SPqJ1fVkhtj3Hw9xjLVXVYrU9QlYWrOLXBpQ6KWjbjTDTdDkoohFzgbEY=
        gitlab.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAfuCHKVTjquxvt6CM6tdG4SLp1Btn/nOeHHE5UOzRdf
        gitlab.com ssh-rsa 
        ssh.dev.azure.com ssh-rsa 
        vs-ssh.visualstudio.com ssh-rsa 
  tlsCertsAnnotations: {}
  tlsCerts: {}
  repositoryCredentials: {}
  secret:
    createSecret: true
    annotations: {}
    githubSecret: ""
    gitlabSecret: ""
    bitbucketServerSecret: ""
    bitbucketUUID: ""
    gogsSecret: ""
    extra: {}
    argocdServerTlsConfig: {}

openshift:
  enabled: false
